<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal - FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <a href="animals.html" class="back-link">&larr; Back to Animals</a>
    <p id="page-feedback" class="page-feedback" hidden></p>
    <div id="animal-detail"><p class="loading">Loading...</p></div>

    <section id="health-section" style="display:none">
      <h3>Health Events</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Vet</th><th>Notes</th></tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>

      <h4>Log Health Event</h4>
      <form id="event-form">
        <label>Type
          <select name="event_type" required>
            <option value="vaccination">Vaccination</option>
            <option value="checkup">Checkup</option>
            <option value="treatment">Treatment</option>
            <option value="injury">Injury</option>
          </select>
        </label>
        <label>Date <input type="date" name="date" required></label>
        <label>Vet <input type="text" name="vet_name" placeholder="Optional"></label>
        <label>Notes <input type="text" name="notes" placeholder="Optional"></label>
        <button type="submit">Log Event</button>
      </form>
      <p id="event-feedback" class="form-feedback" hidden></p>
    </section>

    <section id="weights-section" style="display:none">
      <h3>Weight History</h3>
      <p id="latest-weight" class="empty">No weights recorded.</p>
      <table>
        <thead>
          <tr><th>Date</th><th>Weight kg</th><th>Notes</th></tr>
        </thead>
        <tbody id="weights-body"></tbody>
      </table>

      <h4>Log Weight</h4>
      <form id="weight-form">
        <label>Weight kg
          <input type="number" name="weight_kg" required step="0.1" min="0.1">
        </label>
        <label>Date <input type="date" name="date" required></label>
        <label>Notes <input type="text" name="notes" placeholder="Optional"></label>
        <button type="submit">Log Weight</button>
      </form>
      <p id="weight-feedback" class="form-feedback" hidden></p>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get('id');
    const pageFeedback = document.getElementById('page-feedback');

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const parsedDate = new Date(`${dateValue}T00:00:00`);
      if (Number.isNaN(parsedDate.getTime())) {
        return dateValue;
      }

      return new Intl.DateTimeFormat('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
      }).format(parsedDate);
    }

    function setFeedback(id, message, tone) {
      const element = document.getElementById(id);

      if (!message) {
        element.hidden = true;
        element.textContent = '';
        element.className = 'form-feedback';
        return;
      }

      element.hidden = false;
      element.textContent = message;
      element.className = `form-feedback ${tone}`;
    }

    function setPageFeedback(message) {
      if (!message) {
        pageFeedback.hidden = true;
        pageFeedback.textContent = '';
        return;
      }

      pageFeedback.hidden = false;
      pageFeedback.textContent = message;
    }

    async function load() {
      if (!animalId) {
        document.getElementById('animal-detail').innerHTML = '';
        setPageFeedback('Animal id is missing from the page URL.');
        return;
      }

      try {
        setPageFeedback('');
        const animal = await api.get(`/animals/${animalId}`);

        document.title = `${animal.name} - FarmTracker`;
        document.getElementById('animal-detail').innerHTML = `
          <div class="animal-header">
            <h2>${animal.name}<span class="tag">${animal.tag_number}</span></h2>
          </div>
          <dl>
            <dt>Breed</dt>       <dd>${animal.breed ?? '-'}</dd>
            <dt>Date of Birth</dt><dd>${animal.date_of_birth ? formatDate(animal.date_of_birth) : '-'}</dd>
            <dt>Paddock</dt>     <dd>${animal.paddock_id ?? 'Unassigned'}</dd>
          </dl>
        `;

        document.getElementById('health-section').style.display = 'block';
        document.getElementById('weights-section').style.display = 'block';
        await loadEvents();
        await loadWeights();
      } catch (error) {
        document.getElementById('animal-detail').innerHTML = '';
        document.getElementById('health-section').style.display = 'none';
        document.getElementById('weights-section').style.display = 'none';
        setPageFeedback(error.message || 'Unable to load this animal right now.');
      }
    }

    async function loadEvents() {
      const events = await api.get(`/animals/${animalId}/health-events`);
      const tbody = document.getElementById('events-body');
      tbody.innerHTML = events.length
        ? events.map(event => `
            <tr>
              <td>${formatDate(event.date)}</td>
              <td>${event.event_type}</td>
              <td>${event.vet_name ?? '-'}</td>
              <td>${event.notes ?? '-'}</td>
            </tr>
          `).join('')
        : '<tr><td colspan="4" class="empty">No events recorded.</td></tr>';
    }

    async function loadWeights() {
      const weights = await api.get(`/animals/${animalId}/weights`);
      const latestWeight = document.getElementById('latest-weight');
      const tbody = document.getElementById('weights-body');

      latestWeight.textContent = weights.length
        ? `Latest: ${weights[0].weight_kg} kg on ${formatDate(weights[0].date)}`
        : 'No weights recorded.';

      latestWeight.className = weights.length ? '' : 'empty';

      tbody.innerHTML = weights.length
        ? weights.map(weight => `
            <tr>
              <td>${formatDate(weight.date)}</td>
              <td>${weight.weight_kg}</td>
              <td>${weight.notes ?? '-'}</td>
            </tr>
          `).join('')
        : '<tr><td colspan="3" class="empty">No weights recorded.</td></tr>';
    }

    document.getElementById('event-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      try {
        setFeedback('event-feedback', '', '');
        const data = Object.fromEntries(new FormData(event.target));
        await api.post(`/animals/${animalId}/health-events`, data);
        event.target.reset();
        await loadEvents();
        setFeedback('event-feedback', 'Health event saved.', 'success');
      } catch (error) {
        setFeedback('event-feedback', error.message || 'Unable to save the health event.', 'error');
      }
    });

    document.getElementById('weight-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      try {
        setFeedback('weight-feedback', '', '');
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData);
        data.weight_kg = Number(data.weight_kg);
        await api.post(`/animals/${animalId}/weights`, data);
        event.target.reset();
        await loadWeights();
        setFeedback('weight-feedback', 'Weight entry saved.', 'success');
      } catch (error) {
        setFeedback('weight-feedback', error.message || 'Unable to save the weight entry.', 'error');
      }
    });

    load();
  </script>
</body>
</html>
